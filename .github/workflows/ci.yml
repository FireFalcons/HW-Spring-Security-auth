name: ci.yml
on: [push, pull_request]
jobs:
  build:
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        ports:
          - 3306:3306
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: users
          MYSQL_USER: project_user
          MYSQL_PASSWORD: password
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uproject_user -ppassword"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'
      - name: Wait for MySQL to be ready
        run: |
          echo "Waiting for MySQL to be ready..."
          for i in {1..30}; do
            if mysqladmin ping -h127.0.0.1 -uproject_user -ppassword --silent; then
              echo "MySQL is up!"
              break
            fi
            echo "Waiting..."
            sleep 2
          done
      - name: Build with Maven
        run: mvn clean test
